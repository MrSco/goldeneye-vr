name: Deploy Menu Studio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - tools/menu-studio/**
      - assets/images.def
      - assets/obseg/file_resource_table.inc.c
      - docs/banner.png
      - tools/menu-studio/assets/favicon-64.png
      - .github/workflows/menu-studio-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menu-studio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check menu project behavior
        run: node tools/menu-studio/model.test.mjs
      - name: Build self-contained editor
        run: python3 tools/menu-studio/build.py --site
      - name: Upload only the static editor
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/menu-studio-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@v5
      - name: Publish editor
        id: deployment
        uses: actions/deploy-pages@v4
