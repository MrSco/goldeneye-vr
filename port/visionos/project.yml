# GoldenEye VR for Vision Pro, native: the xcodegen project
# (tools/build_visionos_native.sh, docs/visionos-native.md).
#
# CMake builds the game, its OpenXR runtime and its libraries into
# build/visionos-{device,simulator}/libgevr_visionos_all.a; this project is
# the app around it: the SwiftUI entry (VosApp.swift), Info.plist, the icon
# (Assets.xcassets, assembled by the script),
# the ANGLE frameworks, Apple's frameworks and the signing. Generated, never
# edited: GoldenEyeVR.xcodeproj is git-ignored.
#
# From the environment (tools/build_visionos_native.sh sets them):
#   ANGLE_DIR          ANGLE's one place on the Mac (tools/build_angle_apple.sh)
#   GEVR_ROOT          the repository
#   GEVR_VERSION       0.5.18 (numbers only)
#   GEVR_BUILD         the build number
#   GEVR_BUNDLE_ID     the app's bundle id
#   DEVELOPMENT_TEAM   the Apple team, for a signed device build
name: GoldenEyeVR
options:
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    XROS_DEPLOYMENT_TARGET: "26.0"
    CLANG_ENABLE_OBJC_ARC: "YES"
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    ENABLE_DEBUG_DYLIB: "NO"
    SWIFT_VERSION: "5.0"
    # arm64 only: the library (and ANGLE) has no Intel simulator slice
    EXCLUDED_ARCHS[sdk=xrsimulator*]: x86_64
    GEVR_SLICE: device
    GEVR_SLICE[sdk=xrsimulator*]: simulator
    LIBRARY_SEARCH_PATHS:
      - "${GEVR_ROOT}/build/visionos-$(GEVR_SLICE)"
targets:
  GoldenEyeVR:
    type: application
    platform: visionOS
    sources:
      - path: VosApp.swift
      - path: Assets.xcassets
      # read by name from the bundle (SDL_RWFromFile looks there first)
      - path: ../pc/package/gevr_logo.rgba
        buildPhase: resources
      - path: ../../android/app/src/main/assets/licenses
        type: folder
        buildPhase: resources
    settings:
      base:
        SDKROOT: xros
        SUPPORTED_PLATFORMS: "xros xrsimulator"
        TARGETED_DEVICE_FAMILY: "7"
        PRODUCT_BUNDLE_IDENTIFIER: "${GEVR_BUNDLE_ID}"
        PRODUCT_NAME: GoldenEyeVR
        INFOPLIST_FILE: Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: vos_bridging.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "${GEVR_VERSION}"
        CURRENT_PROJECT_VERSION: "${GEVR_BUILD}"
        OTHER_LDFLAGS: "-lgevr_visionos_all -lc++"
    dependencies:
      # ANGLE supplies every gl* and egl* call (iOS's slices retargeted)
      - framework: "${ANGLE_DIR}/xcframeworks-visionos/libGLESv2.xcframework"
        embed: true
        codeSign: true
      - framework: "${ANGLE_DIR}/xcframeworks-visionos/libEGL.xcframework"
        embed: true
        codeSign: true
      - sdk: CompositorServices.framework
      - sdk: ARKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreMotion.framework
      - sdk: GameController.framework
      - sdk: Foundation.framework
      - sdk: CoreFoundation.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: UniformTypeIdentifiers.framework
