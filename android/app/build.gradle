plugins {
    id 'com.android.application'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = rootProject.file("android/keystore.properties")
}
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Discord's Social SDK (port/vr/vr_discord.cpp) is not in the repository: its Android
// library comes from the developer portal into build/discord/ (gitignored), or wherever
// gevr.discordSdk in local.properties points. Without it the game builds without Discord.
def localProperties = new Properties()
if (rootProject.file("local.properties").exists()) localProperties.load(new FileInputStream(rootProject.file("local.properties")))
def discordSdk = file(localProperties.getProperty("gevr.discordSdk", "${rootProject.projectDir}/../build/discord/discord_partner_sdk.aar"))
def withDiscord = discordSdk.exists()
logger.lifecycle("Discord Social SDK: " + (withDiscord ? discordSdk : "not found, building without Discord"))

android {
    namespace 'com.gevr.port'
    compileSdk 34

    defaultConfig {
        applicationId "com.gevr.port"
        minSdk 24
        targetSdk 34
        versionCode 130
        versionName "0.5.17"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DANDROID_STL=c++_shared",
                        "-DANDROID_PLATFORM=android-24",
                        "-DTARGET_OS=android",
                        "-DGEVR_DISCORD=" + (withDiscord ? "ON" : "OFF")
            }
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                def rawPath = keystoreProperties['storeFile']
                if (!rawPath) throw new GradleException("storeFile missing in keystore.properties")
                if (keystorePropertiesFile.parentFile.name == 'android' && rawPath.startsWith('android/')) {
                    rawPath = rawPath.substring('android/'.length())
                }
                File resolved = new File(rawPath)
                if (!resolved.isAbsolute()) {
                    File propRel = new File(keystorePropertiesFile.parentFile, rawPath)
                    if (propRel.exists()) {
                        resolved = propRel
                    } else {
                        resolved = new File(rootProject.projectDir, rawPath)
                    }
                }
                storeFile file(resolved)
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            ndk { debugSymbolLevel 'SYMBOL_TABLE' }
        }
        // Unattended Quest profiling only; never shipped. Same code, signing and
        // package as release, plus src/benchmark/AndroidManifest.xml, which
        // declares optional hand tracking so the headset launches it with the
        // controllers asleep. tools/perf/quest_profile.py installs it.
        benchmark {
            initWith release
            matchingFallbacks = ['release']
        }
    }

    // Three APKs from one tree (docs/mobile-platforms.md): the Quest's, the
    // phone/tablet one (flat, touch and pads, no OpenXR; GEVR_MOBILE in
    // CMakeLists.txt) and the Steam Frame's (the Quest's game with Khronos's
    // OpenXR loader, GEVR_FRAME; docs/pc-platforms.md "Steam Frame").
    // assembleQuestRelease / assembleMobileRelease / assembleFrameRelease; the
    // APKs land in outputs/apk/<flavor>/<type>/.
    flavorDimensions 'device'
    productFlavors {
        quest {
            dimension 'device'
        }
        mobile {
            dimension 'device'
            applicationIdSuffix '.mobile'   // installs beside the Quest's
            externalNativeBuild {
                cmake {
                    arguments "-DGEVR_MOBILE=ON"
                }
            }
        }
        frame {
            dimension 'device'
            applicationIdSuffix '.frame'   // its own updates (UpdateVersion.apkDevice)
            externalNativeBuild {
                cmake {
                    arguments "-DGEVR_FRAME=ON"
                }
            }
        }
    }

    buildFeatures {
        prefab true   // Discord's SDK (when found) and the Frame's OpenXR loader, for CMake's find_package
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true  // Android logging/clock calls in JVM lobby tests
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
        quest {
            jniLibs.srcDirs = ['../../OpenXR/Libs/Android']   // Meta's OpenXR loader: the Quest's only
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    if (withDiscord) {
        implementation files(discordSdk)
        implementation 'androidx.browser:browser:1.8.0'   // the SDK's sign-in in the browser
    }
    // the Steam Frame's OpenXR loader (Khronos's; the Quest's is Meta's, in OpenXR/Libs)
    frameImplementation 'org.khronos.openxr:openxr_loader_for_android:1.1.65'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'  // Real JSON parsing in local JVM tests
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
